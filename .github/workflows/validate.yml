name: Validate ShikkhaHub
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm run check:secrets
      - run: npm ci
      - name: Install and check certificate PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          command -v pdftotext
          pdftotext -v
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
        env:
          E2E_BROWSER_CHANNEL: chromium
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: isolated-ci-public-key
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
